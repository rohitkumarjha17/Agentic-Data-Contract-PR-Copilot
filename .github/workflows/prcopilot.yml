name: PR Copilot Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Schema diff against base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:schemas/schema.yaml > schemas/_base.yaml
          cp schemas/schema.yaml schemas/_head.yaml
          prcopilot diff --base schemas/_base.yaml --head schemas/_head.yaml --out artifacts/diff.json

      - name: Contract checks
        run: |
          prcopilot contract --contract contracts/orders_contract.yaml --data examples/data/orders.csv --out artifacts/contract_report.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcopilot-artifacts
          path: |
            artifacts/diff.json
            artifacts/contract_report.json
            schemas/_base.yaml
            schemas/_head.yaml
