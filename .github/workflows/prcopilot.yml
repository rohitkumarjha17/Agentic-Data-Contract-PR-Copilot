name: PR Copilot Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Prepare output dirs
        run: |
          mkdir -p artifacts

      - name: Schema diff against base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:schemas/schema.yaml > schemas/_base.yaml
          cp schemas/schema.yaml schemas/_head.yaml
          prcopilot diff --base schemas/_base.yaml --head schemas/_head.yaml --out artifacts/diff.json

      - name: Contract checks
        run: |
          prcopilot contract --contract contracts/orders_contract.yaml --data examples/data/orders.csv --out artifacts/contract_report.json

      - name: Build PR comment markdown
        if: github.event_name == 'pull_request'
        run: |
          python scripts/pr_comment.py

      - name: Comment on PR with PR Copilot summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('artifacts/pr_comment.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const marker = "## PR Copilot Report";
            const existing = comments.data.find(c => c.user?.type === "Bot" && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Build PR comment body
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python scripts/pr_comment.py > pr_comment.md
          echo "" >> pr_comment.md
          echo "_Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_" >> pr_comment.md

      - name: Comment on PR (sticky)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr_comment.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcopilot-artifacts
          path: |
            artifacts/diff.json
            artifacts/contract_report.json
            schemas/_base.yaml
            schemas/_head.yaml