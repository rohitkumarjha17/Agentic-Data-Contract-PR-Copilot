name: PR Copilot Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml','requirements-dev.txt') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Prepare output dirs
        run: |
          mkdir -p artifacts

      - name: Schema diff against base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:schemas/schema.yaml > schemas/_base.yaml
          cp schemas/schema.yaml schemas/_head.yaml
          prcopilot diff --base schemas/_base.yaml --head schemas/_head.yaml --out artifacts/diff.json

      - name: Contract checks
        run: |
          prcopilot contract --contract contracts/orders_contract.yaml --data examples/data/orders.csv --out artifacts/contract_report.json

      - name: Build PR comment markdown
        if: always()
        run: |
          python scripts/pr_comment.py

      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('artifacts/pr_comment.md', 'utf8');
            const marker = '<!-- prcopilot-report -->';

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number,
                body
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prcopilot-artifacts
          path: |
            artifacts/diff.json
            artifacts/contract_report.json
            artifacts/pr_comment.md
            schemas/_base.yaml
            schemas/_head.yaml

      - name: Gate
        run: |
          python scripts/ci_gate.py
